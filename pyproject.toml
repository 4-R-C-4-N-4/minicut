[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicut"
version = "0.1.0"
description = "Local ffmpeg editor driven by MiniCPM5-2B + LoRA (JSON tool calls, llama.cpp + GBNF)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["minicut*", "factory*"]
